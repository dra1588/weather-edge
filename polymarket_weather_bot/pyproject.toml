[project]
name = "polymarket-weather-bot"
version = "0.1.0"
description = "Risk-gated Polymarket weather market scanner and paper trader"
requires-python = ">=3.11"
dependencies = [
  "httpx[socks]>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
live = ["py-clob-client>=0.19,<1"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "respx>=0.21,<1"]

[project.scripts]
weatherbot = "weatherbot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weatherbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
